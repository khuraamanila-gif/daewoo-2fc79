<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daewoo FasteXHub Courier</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#0f172a,#1e3a8a);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
width:100%;
max-width:700px;
background:#fff;
border-radius:20px;
padding:40px;
text-align:center;
box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.logo{
font-size:38px;
font-weight:700;
color:#003b95;
margin-bottom:10px;
}

.tagline{
color:#555;
margin-bottom:35px;
font-size:16px;
}

.track-box{
display:flex;
gap:12px;
flex-wrap:wrap;
justify-content:center;
}

input{
flex:1;
min-width:250px;
padding:16px;
border:2px solid #dcdcdc;
border-radius:12px;
font-size:16px;
outline:none;
}

button{
padding:16px 28px;
border:none;
border-radius:12px;
background:#003b95;
color:#fff;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#00296b;
}

.features{
margin-top:40px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
}

.card{
padding:18px;
background:#f5f7fb;
border-radius:12px;
}

.card h3{
margin-bottom:8px;
color:#003b95;
}
</style>
</head>
<body>

<div class="container">

<div class="logo">Daewoo FasteXHub</div>
<div class="tagline">Fast • Secure • Reliable Courier Tracking</div>

<div class="track-box">
<input type="text" id="trackingNumber" placeholder="Enter Consignment Number">
<button onclick="trackShipment()">TRACK</button>
</div>

<div class="features">
<div class="card">
<h3>Real-Time Tracking</h3>
<p>Track your shipment instantly.</p>
</div>

<div class="card">
<h3>Nationwide Delivery</h3>
<p>Coverage across Pakistan.</p>
</div>

<div class="card">
<h3>Fast Transit</h3>
<p>Reliable logistics network.</p>
</div>
</div>

</div>

<script>
function trackShipment() {

  const cn = document.getElementById("trackingNumber").value.trim();

  if (cn !== "KI0605813169") {
    alert("Invalid Consignment Number");
    return;
  }

  window.location.href = "track.html?cn=KI0605813169";
}
</script>
